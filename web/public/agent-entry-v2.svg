      <stop offset="0.48" stop-color="#658BFF"/>
      <stop offset="1" stop-color="#A56BFF"/>
    </linearGradient>
    <linearGradient id="orbit" x1="20" y1="22" x2="108" y2="108" gradientUnits="userSpaceOnUse">
